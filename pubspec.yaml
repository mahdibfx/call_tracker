name: call_tracker
description: "El Ameed staff app — calls and problem reports, by role."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.0

dependencies:
  firebase_core: ^4.12.1
  flutter:
    sdk: flutter
  http: ^1.2.0
  http_parser: ^4.1.0
  image_picker: ^1.1.2
  permission_handler: ^12.0.3
  phone_state: ^3.0.1
  shared_preferences: ^2.5.5
  top_snackbar_flutter: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# Regenerate after changing assets/icon:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#F2662C"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  remove_alpha_ios: true
